server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets aggressively (Vite content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy API requests to the FastAPI backend service
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Proxy health and readiness checks to backend
    location ~ ^/(health|ready) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # The HTML entry point is never cached: after a redeploy it names the new content-hashed chunks, and a stale
    # copy would request chunks that no longer exist. Every HTML response is served here: "/" (index directive)
    # and client-side routes (try_files fallback) are internal redirects to /index.html, which this exact match
    # takes. Hashed files under /assets/ keep their long-lived caching above.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SPA fallback: serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
