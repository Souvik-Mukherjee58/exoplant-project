# ==============================================================================
# Netlify Configuration for ExoSignal Frontend (Direct frontend base directory)
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
# ==============================================================================

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Single-Page Application (SPA) routing: redirect all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Aggressive cache headers for Vite content-hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

