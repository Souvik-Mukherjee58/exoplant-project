# ==============================================================================
# Fly.io App Configuration for ExoSignal Backend Service
# Docs: https://fly.io/docs/reference/configuration/
# ==============================================================================

app = "exosignal-backend"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  EXOSIGNAL_ENV = "production"
  PORT = "8000"
  LOG_LEVEL = "info"
  JSON_LOGS = "true"
  RATE_LIMIT_PER_MINUTE = "120"
  WORKERS = "2"
  CORS_ORIGINS = '["https://*.vercel.app", "https://*.netlify.app", "http://localhost:3000"]'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/ready"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

