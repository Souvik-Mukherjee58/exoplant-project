# Pre-commit configuration for ExoSignal
# Configured for: Ruff (Python lint & format), ESLint (Frontend JavaScript/JSX), Prettier (Code formatting)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']

  # Ruff: Fast Python linter and code formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Prettier: Multi-language code formatter (JS, JSX, CSS, JSON, Markdown, YAML)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, css, json, yaml, markdown]
        exclude: ^(backend/artifacts/|node_modules/|dist/)

  # ESLint: JavaScript and React static analysis
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.[jt]sx?$
        args: [--config, frontend/.eslintrc.cjs]
        additional_dependencies:
          - eslint@8.57.0
          - eslint-plugin-react@7.34.0
          - eslint-plugin-react-hooks@4.6.0

