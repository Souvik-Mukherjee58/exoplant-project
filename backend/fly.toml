# Fly.io config for the ExoSignal API. Deploy from this directory (the Docker build context):
#   cd backend && fly deploy
# Set the frontend origin before the first deploy (exact URL, no wildcards):
#   fly secrets set CORS_ORIGINS='["https://<your-app>.vercel.app"]'

app = "exosignal-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  EXOSIGNAL_ENV = "production"
  PORT = "8000"
  LOG_LEVEL = "info"
  JSON_LOGS = "true"
  RATE_LIMIT_PER_MINUTE = "120"
  # Fly's proxy appends the client address to X-Forwarded-For: trust exactly one hop.
  TRUSTED_PROXY_HOPS = "1"
  WORKERS = "2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 0 = no cost while idle, but the first request after idle waits for a cold start.
  # Set to 1 while you are job-hunting so a recruiter's first click is fast.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/ready"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
