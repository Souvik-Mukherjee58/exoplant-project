[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    "venv",
    ".venv",
    "dist",
    "build",
    "__pycache__"
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "BLE001",  # no blind `except Exception` unless it re-raises or logs (audit F-07)
    "S110",  # no try-except-pass
]
ignore = [
    "E501",
    "B008",
    "B904",
    "E712",
    "B905",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "."
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# Every module of the application (was app.ml and app.scoring only; the rest was brought to this standard in 2026-11).
module = ["app.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
disallow_any_generics = false
