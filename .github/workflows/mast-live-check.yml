name: MAST live check (manual)

# Manual end-to-end check against the LIVE MAST and NASA Exoplanet Archive services.
# The MAST cache is never committed, so in CI this job fetches a fresh cache and then re-queries
# random proposals. It proves the pipeline works against the real APIs; it is not a check of your
# local cache. To check a local cache, run `python scripts/check_mast_cache.py` on your machine.

on:
  workflow_dispatch:

# Least privilege: these jobs run project code, so the token can only read and is not kept in the checkout.
permissions:
  contents: read

jobs:
  mast-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Build candidates from live MAST (outputs stay in the runner)
        run: |
          python scripts/build_jwst_labels_from_mast.py --force-refresh \
            --output "$RUNNER_TEMP/jwst_mast_candidates.csv" \
            --summary "$RUNNER_TEMP/jwst_mast_summary.md"
          cat "$RUNNER_TEMP/jwst_mast_summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Re-verify cache against live MAST
        run: python scripts/check_mast_cache.py -n 3
