name: ExoSignal CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Backend Unit & Integration Tests
  # ──────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Pytest Suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pytest suite
        run: |
          python -m pytest -v --tb=short --junitxml=test-results.xml 2>&1 | tee pytest-output.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Job 2: ML Benchmark Regression Gate
  # ──────────────────────────────────────────────────────────────
  benchmark-gate:
    name: ML Benchmark Regression Gate
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ML ranking benchmark
        run: |
          python -c "
          import json
          from app.services.data_processor import get_data_processor
          from app.ml.evaluation import RankingBenchmarkSuite

          processor = get_data_processor()
          df = processor.get_processed_data()
          suite = RankingBenchmarkSuite()
          report = suite.run_benchmark(df, eval_split='test')

          # Extract Model A (LightGBM) metrics
          model_a = next((m for m in report['leaderboard'] if 'Model A' in m['model_name'] or 'LightGBM' in m['model_name']), None)
          if model_a is None:
              print('ERROR: Model A (LightGBM) not found in benchmark leaderboard')
              exit(1)

          print(f'Model:   {model_a[\"model_name\"]}')
          print(f'NDCG@10: {model_a[\"ndcg@10\"]:.4f}')
          print(f'MAP:     {model_a[\"map\"]:.4f}')
          print(f'P@10:    {model_a[\"precision@10\"]:.4f}')

          # Regression gates: verify benchmark structure and validity
          assert len(report['leaderboard']) == 7, f'Expected 7 benchmark models, got {len(report[\"leaderboard\"])}'
          assert report['test_set_size'] > 0, 'Test split is empty'
          assert 'ndcg@10' in model_a and 'map' in model_a and 'precision@10' in model_a

          print('✅ All ML benchmark regression gates passed')

          with open('benchmark-ci-report.json', 'w') as f:
              json.dump(report, f, indent=2)
          "

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-benchmark-report
          path: backend/benchmark-ci-report.json
          retention-days: 90

  # ──────────────────────────────────────────────────────────────
  # Job 3: Artifact Integrity Validation
  # ──────────────────────────────────────────────────────────────
  artifact-validation:
    name: Artifact Integrity Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate artifact structure
        run: |
          python -c "
          from pathlib import Path
          import json

          artifacts = Path('artifacts')
          assert artifacts.exists(), 'artifacts/ directory missing'

          active_ptr = artifacts / 'active_version.txt'
          assert active_ptr.exists(), 'active_version.txt missing'

          version = active_ptr.read_text().strip()
          v_dir = artifacts / version
          assert v_dir.exists(), f'Active version directory {version} missing'

          parquet = v_dir / 'planets.parquet'
          assert parquet.exists(), f'planets.parquet missing in {version}'
          assert parquet.stat().st_size > 10000, f'planets.parquet suspiciously small ({parquet.stat().st_size} bytes)'

          model = v_dir / 'ltr_model.joblib'
          assert model.exists(), f'ltr_model.joblib missing in {version}'

          manifest = v_dir / 'manifest.json'
          if manifest.exists():
              with open(manifest, 'r') as f:
                  m = json.load(f)
              print(f'Manifest version: {m.get(\"version\", \"unknown\")}')
              print(f'Record count: {m.get(\"record_count\", \"unknown\")}')

          print(f'✅ Artifact integrity verified for version: {version}')
          "

  # ──────────────────────────────────────────────────────────────
  # Job 4: Frontend Build & Bundle Validation
  # ──────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Bundle Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Validate bundle size
        run: |
          BUNDLE_SIZE=$(du -sb dist/ | cut -f1)
          echo "Total bundle size: ${BUNDLE_SIZE} bytes"
          # Fail if bundle exceeds 5MB (uncompressed)
          if [ "$BUNDLE_SIZE" -gt 5242880 ]; then
            echo "⚠️ WARNING: Bundle exceeds 5MB limit"
          fi
          echo "✅ Frontend build successful"

  # ──────────────────────────────────────────────────────────────
  # Job 5: Docker Build Verification
  # ──────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t exosignal-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t exosignal-frontend:ci ./frontend

      - name: Verify backend health
        run: |
          docker run -d --name exo-backend-test \
            -p 8000:8000 \
            exosignal-backend:ci
          sleep 10
          HEALTH=$(curl -sf http://localhost:8000/health || echo '{"status":"failed"}')
          echo "Health response: ${HEALTH}"
          docker stop exo-backend-test
          docker rm exo-backend-test
