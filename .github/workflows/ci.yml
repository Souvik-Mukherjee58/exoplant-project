name: ExoSignal CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22' # jsdom 30 / undici 8 / jest-dom 7 require Node >= 22; Node 20 is EOL

# Least privilege: these jobs run project code, so the token can only read and is not kept in the checkout.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Backend Linting, Formatting, Strict Typing & Pytest
  # ──────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Lint, Type Check & Test Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check app tests

      - name: Check formatting with Ruff
        run: ruff format --check app tests

      - name: Strict type check with Mypy (app/ml & app/scoring)
        run: mypy -p app.ml -p app.scoring

      - name: Run pytest with coverage (fail under 80% on app/ml and app/scoring)
        run: |
          set -o pipefail # otherwise 'tee' hides a failing test run
          pytest --cov=app.ml --cov=app.scoring --cov-fail-under=80 -v --junitxml=test-results.xml 2>&1 | tee pytest-output.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Job 2: Small Fixture Pipeline & Evaluation Report Schema Gate
  # ──────────────────────────────────────────────────────────────
  pipeline-fixture:
    name: Small Fixture Pipeline & Evaluation Schema Validation
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute build pipeline on small fixture and validate evaluation report schema
        run: |
          pytest tests/test_pipeline_fixture.py -v

  # ──────────────────────────────────────────────────────────────
  # Job 3: ML Benchmark Regression Gate
  # ──────────────────────────────────────────────────────────────
  benchmark-gate:
    name: ML Benchmark Regression Gate
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ML ranking benchmark gate
        # Runs the benchmark only with >= 15 human-verified labels; otherwise validates the committed
        # evaluation report and emits a visible ::warning:: (never counts unverified labels).
        run: python ../scripts/ci_benchmark_gate.py --require-metrics ap,ndcg@25

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-benchmark-report
          path: backend/benchmark-ci-report.json
          retention-days: 90

  # ──────────────────────────────────────────────────────────────
  # Job 4: Artifact Integrity Validation
  # ──────────────────────────────────────────────────────────────
  artifact-validation:
    name: Artifact Integrity Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify checksums and reproduce the catalog from its sources
        run: python ../scripts/reproduce_artifact.py

      - name: Validate artifact structure
        run: |
          python -c "
          from pathlib import Path
          import json

          artifacts = Path('artifacts')
          assert artifacts.exists(), 'artifacts/ directory missing'

          active_ptr = artifacts / 'active_version.txt'
          assert active_ptr.exists(), 'active_version.txt missing'

          version = active_ptr.read_text().strip()
          v_dir = artifacts / version
          assert v_dir.exists(), f'Active version directory {version} missing'

          parquet = v_dir / 'planets.parquet'
          assert parquet.exists(), f'planets.parquet missing in {version}'
          assert parquet.stat().st_size > 10000, f'planets.parquet suspiciously small ({parquet.stat().st_size} bytes)'

          model = v_dir / 'ltr_model.joblib'
          assert model.exists(), f'ltr_model.joblib missing in {version}'

          manifest = v_dir / 'manifest.json'
          if manifest.exists():
              with open(manifest, 'r') as f:
                  m = json.load(f)
              print(f'Manifest version: {m.get(\"artifact_version\", m.get(\"version\", \"unknown\"))}')

          print(f'✅ Artifact integrity verified for version: {version}')
          "

      - name: Validate README benchmark results table freshness
        run: |
          python ../scripts/render_readme_results.py --check

  # ──────────────────────────────────────────────────────────────
  # Job 5: Frontend Lint, Test & Build Validation
  # ──────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting with Prettier (same version as the commit hook)
        run: npm run format:check

      - name: Run unit & component tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Validate bundle size
        run: |
          BUNDLE_SIZE=$(du -sb dist/ | cut -f1)
          echo "Total bundle size: ${BUNDLE_SIZE} bytes"
          # Warn if bundle exceeds 5MB (uncompressed)
          if [ "$BUNDLE_SIZE" -gt 5242880 ]; then
            echo "⚠️ WARNING: Bundle exceeds 5MB limit"
          fi
          echo "✅ Frontend build successful"

  # ──────────────────────────────────────────────────────────────
  # Job 6: Docker Compose Build Verification
  # ──────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker Compose
        run: docker compose build
